<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodvar's Page</title>
    <style>
        body {
            background-color: #000000; /* Ultra black background */
            color: #00FF00; /* Green text */
            font-family: monospace;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column; /* Stack elements vertically */
            overflow: hidden;
        }

        /* Background ASCII effect */
        body::before {
            content: '\n           ______\n        .-"      "-.\n       /            \\\n      |              |\n      |,  .-.  .-.  ,|\n      | )(__/  \\__)( |\n      |/     /\\     \\|\n      (_     ^^     _)\n       \\__|IIIIII|__/\n        | \\IIIIII/ |\n        \\          /\n  Bod    `--------`\n';
            color: #00FF00; /* Ensure ASCII art is green */
            font-size: 0.8rem; /* Adjust size for visual effect */
            line-height: 1.5rem; /* Proper spacing between lines */
            white-space: pre;
            opacity: 0.1; /* Make the background less intense */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Push it to the background */
            overflow: hidden;
        }

        .content {
            z-index: 1; /* Ensure content is above the background */
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .arabic-text {
            margin-top: 1rem; /* Add spacing above the Arabic text */
        }

        .about-me {
            margin-top: 1rem; /* Add spacing above "About Me" */
            color: #00FF00;
        }
    </style>
</head>
<body>
    <div class="content">
        <!-- Arabic Text -->
        <p class="arabic-text">
            إذا أبصرت قبرا من بعيد<br>
            وددت لو أنني مما يليه<br>
            ألا رحم المهيمن نفس حر<br>
            تصدق بالوفاة على أخيه
        </p>

        <!-- "About Me" Text -->
        <p class="about-me">I'm Bodvar, a friendly human, come and talk with me</p>
    </div>
</body>
</html>
