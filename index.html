<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodvar // Security Terminal</title>
    <style>
        body {
            background-color: #000000; /* Black background */
            color: #00ff00; /* Green text */
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-shadow: 0 0 8px #00ff0080; /* Green glow */
        }

        .terminal-text {
            text-align: center;
            line-height: 1.5;
            max-width: 600px;
        }

        .alert {
            color: #ff0000; /* Red alert text */
            font-size: 1.5em;
            animation: glitch 0.8s infinite;
            margin-top: 2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Typewriter animation */
        @keyframes typewriter {
            from { width: 0; }
            to { width: 100%; }
        }

        /* Glitch effect for alert */
        @keyframes glitch {
            0% { text-shadow: 2px 2px #ff0000, -2px -2px #00ffff; }
            25% { transform: translate(2px, -2px); }
            50% { text-shadow: -2px 2px #ff00ff, 2px -2px #ffff00; }
            75% { transform: translate(-1px, 1px); }
            100% { text-shadow: 2px 2px #ff0000, -2px -2px #00ffff; }
        }

        .typewriter {
            overflow: hidden;
            border-right: 2px solid #00ff00; /* Green cursor */
            white-space: nowrap;
            margin: 0 auto;
            animation: 
                typewriter 3s steps(40) 1s 1 normal both,
                blink-caret 0.75s step-end infinite;
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #00ff00; }
        }
    </style>
</head>
<body>
    <div class="terminal-text">
        <div class="typewriter">
            socials<br>
            instagram: boddvar<br>
            discord: bodvvarr
        </div>
        <br>
        <div class="typewriter" style="animation-delay: 4s">
            I build, I create, I disrupt.<br>
            No fluff, no filler, just raw execution.<br>
            Whether it's code, content, or ideas, I make the difference.<br>
            If you're looking for the ordinary, you're in the wrong place.
        </div>
    </div>
    
    <div class="alert">
        ⚠️ Alert: your defense is broken ⚠️
    </div>

    <script>
        // Add terminal-like flicker effect
        document.addEventListener('mousemove', () => {
            document.body.style.opacity = Math.random() > 0.1 ? 1 : 0.9;
        });

        // Add random character flicker
        setInterval(() => {
            const texts = document.querySelectorAll('.terminal-text, .alert');
            texts.forEach(text => {
                if (Math.random() > 0.95) {
                    text.style.opacity = '0.8';
                    setTimeout(() => text.style.opacity = '1', 50);
                }
            });
        }, 100);
    </script>
</body>
</html>
